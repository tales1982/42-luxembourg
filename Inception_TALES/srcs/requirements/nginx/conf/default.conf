##########################################
###     CONFIGURACAO DO SERVIDOR       ###
##########################################

server {
    # Escuta na porta 443 com SSL
    listen 443 ssl;
    server_name SEU_DOMINIO; 
    # Exemplo: server_name login.42.fr;

    # Caminho para o certificado e a chave (ajuste conforme seus arquivos)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Forçar apenas TLS 1.2 e 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Se quiser servir um site estático (exemplo):
    # root /usr/share/nginx/html;
    # index index.html;

    # Ou, se estiver usando PHP-FPM em outro container (WordPress),
    # você pode configurar um proxy ou fastcgi_pass:
    # location / {
    #     proxy_pass http://wordpress:9000;
    # }

    # Se quiser redirecionar requisições de .php para PHP-FPM (fastcgi), algo assim:
    # location ~ \.php$ {
    #     fastcgi_pass wordpress:9000;  # nome do container e porta
    #     include fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    # }

    # Ajuste conforme a arquitetura do seu docker-compose (volumes, upstream etc.)
}
