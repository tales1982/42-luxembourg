<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Webserv 42</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: "Segoe UI", Roboto, sans-serif; }
    html, body { height:100%; }
    body{
      color:#fff; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:40px;
      /* Keep only the base color; the image is applied via JS (with cache-buster) */
      background-color:#111;
      background-position:center center; background-repeat:no-repeat; background-attachment:fixed; background-size:cover;
    }
    .container{
      background:rgba(0,0,0,0.35);
      padding:40px; border-radius:16px; max-width:700px; width:100%; text-align:center;
      box-shadow:0 8px 24px rgba(0,0,0,0.5); backdrop-filter:blur(4px);
    }
    h1{ font-size:2.8rem; margin-bottom:25px; color:#ffda79; text-shadow:0 0 10px rgba(255,218,121,.8); }
    ul{ list-style:none; margin:20px 0; }
    ul li{ margin:14px 0; }
    ul li a{ text-decoration:none; color:#00e0ff; font-weight:bold; font-size:1.2rem; transition:.2s; }
    ul li a:hover{ color:#ffda79; transform:scale(1.08); }
    form{ margin-top:30px; text-align:left; }
    form h3{ margin-bottom:10px; color:#ffd86b; }
    textarea{
      width:100%; padding:12px; border-radius:8px; border:none; resize:none; outline:none; font-size:1rem;
      background:rgba(255,255,255,.15); color:#fff;
    }
    button{
      margin-top:12px; padding:12px 24px; border:none; border-radius:8px;
      background:linear-gradient(135deg,#ffda79,#ff9a3c); color:#000; font-weight:bold; font-size:1rem; cursor:pointer;
      transition: transform .2s, box-shadow .2s;
    }
    button:hover{ transform:translateY(-2px); box-shadow:0 4px 12px rgba(255,218,121,.6); }

    /* Debug bar */
    #dbgbar{
      position:fixed; top:8px; left:8px; z-index:9999;
      background:#000a; color:#fff; padding:6px 10px; border-radius:6px; font:14px system-ui;
      display:flex; gap:8px; align-items:center;
    }
    #dbgthumb{ height:44px; border-radius:6px; border:2px solid #fff; }
    #dbginfo small{ display:block; opacity:.85; }
    #dbginfo a{ color:#00e0ff; text-decoration:none; }
    #dbginfo a:hover{ text-decoration:underline; }
  </style>
</head>
<body>
  <!-- DEBUG: image status + thumbnail + links -->
  <div id="dbgbar">
    <strong>DEBUG IMG</strong>
    <img id="dbgthumb" alt="(thumb)" />
    <div id="dbginfo">
      <div id="dbgstatus">loading…</div>
      <small><a id="dbglink" href="#" target="_blank" rel="noopener">open image</a></small>
      <small><a href="/testbg.html" target="_blank" rel="noopener">isolated test</a></small>
    </div>
  </div>

  <div class="container">
    <h1>🚀 Webserv 42</h1>
    <ul>
      <li><a href="/send_files/">📤 Send file (UI)</a></li>
      <li><a href="/view_uploads/">📁 View uploads</a></li>
      <li><a href="/cgi/echo.py">⚡ Dynamic CGI page</a></li>
      <li><a href="/tests/index.html">🧪 Test suite</a></li>
    </ul>

    <!--
    <form method="POST" action="/files/">
      <h3>Quick Upload (POST)</h3>
      <textarea name="data" rows="4" cols="60" placeholder="Type something and submit"></textarea><br>
      <button>Send</button>
    </form>
    -->
  </div>

  <script>
    // Force a cache-buster so we can see if it's not a cached background.
    const base = "/images/serve1.jpg";
    const url  = base + "?cb=" + Date.now();

    // Quick link to open the image directly
    document.getElementById("dbglink").href = base;

    // Show a small thumb (if it fails, we know the fetch will fail too)
    const thumb = document.getElementById("dbgthumb");
    thumb.src = url;

    // Try to fetch and apply as background if 200
    const statusEl = document.getElementById("dbgstatus");
    fetch(url, { cache: "no-store" }).then(async (res) => {
      statusEl.textContent = "fetch: " + res.status + " " + res.statusText;
      if (res.ok) {
        document.body.style.backgroundImage = `url("${url}")`;
        document.body.style.backgroundPosition = "center center";
        document.body.style.backgroundRepeat = "no-repeat";
        document.body.style.backgroundAttachment = "fixed";
        document.body.style.backgroundSize = "cover";
      }
    }).catch((e) => {
      statusEl.textContent = "fetch ERROR: " + e;
    });
  </script>
</body>
</html>
