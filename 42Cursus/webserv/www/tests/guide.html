<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Execution Guide (CLI)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --bg:#0e1a2a; --panel:#13233a; --txt:#e8f0ff; --muted:#cfd8dc; --accent:#ffd54a; }
    * { box-sizing:border-box; }
    body{
      margin:0; font-family:system-ui,Segoe UI,Roboto,Ubuntu; color:var(--txt);
      background: #0b1522 url("/images/serve8.jpg") no-repeat center center fixed;
      background-size: cover;
    }
    .wrap{ max-width:900px; margin:0 auto; padding:24px 16px 40px; background:rgba(0,0,0,0.55); border-radius:16px; }
    a.back{ color:var(--accent); text-decoration:none; font-weight:700; }
    h1{ margin:12px 0 8px; font-size:24px; }
    p.muted{ color:var(--muted); }
    .card{ margin-top:14px; background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      border:1px dashed rgba(255,255,255,.35); border-radius:16px; padding:16px; }
    h3 { margin: 12px 0 8px; }
    pre{ background:rgba(0,0,0,.35); padding:12px; border-radius:12px; overflow:auto; color:#fff; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tip{ color:var(--muted); font-size:14px; }
    .kbd{ padding:2px 6px; border:1px solid rgba(255, 255, 255, 0.418); border-radius:6px; background:rgba(255,255,255,.06); }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Back to tests</a>
    <h1 id="title">Guide</h1>
    <p class="muted" id="desc">This test requires the command line. Follow the steps below.</p>

    <section class="card" id="content">
      <h3>Commands</h3>
      <pre id="cmd">—</pre>

      <h3>Expected output</h3>
      <pre id="expected">—</pre>

      <h3 id="details">Notes</h3>
      <div id="notes" class="tip">—</div>
    </section>
  </div>

  <script>
    const id = new URLSearchParams(location.search).get('id') || '';

    const GUIDES = {
      // ===================== Multi-host / server_name =====================
      'vhost': {
        title: 'Multi-host (server_name)',
        desc: 'Validates that each virtual host responds according to its server_name.',
        cmd:
`# Test Host A:
curl -s --resolve sitea.local:8081:127.0.0.1 http://sitea.local:8081/

# Test Host B:
curl -s --resolve siteb.local:8082:127.0.0.1 http://siteb.local:8082/`,
        expected:
`# Expected HTML for Site A:
<!doctype html><title>SITE A (hostname)</title><h1>SITE A (hostname)</h1>

# Expected HTML for Site B:
<!doctype html><title>SITE B (hostname)</title><h1>SITE B (hostname)</h1>`,
        notes:
`• Adjust domains and ports according to your config (e.g., <code>configs/multi.conf</code>).
• The <span class="kbd">--resolve</span> parameter forces DNS to 127.0.0.1 without editing <code>/etc/hosts</code>.
• The test PASSES if each host returns its own expected HTML title/body as shown above.`
      },

      // ===================== UNKNOWN method =====================
      'unknown': {
        title: 'UNKNOWN method',
        desc: 'Ensures the server does not crash with unknown methods.',
        cmd:
`curl -i -X FOO http://127.0.0.1:8080/`,
        expected:
`HTTP/1.1 405 Method Not Allowed
Allow: GET, HEAD

# (Some implementations may return 400 Bad Request instead.)`,
        notes:
`• If it returns 405, confirm the <span class="kbd">Allow</span> header lists supported methods for the target location.
• Either 405 or 400 (with no crash) is accepted depending on your rubric.`
      },

      // ===================== Siege / stress =====================
      'siege': {
        title: 'Stress (siege)',
        desc: 'Runs a short load test and measures availability.',
        cmd:
`# Install siege (Ubuntu/Debian):
sudo apt-get update && sudo apt-get install -y siege

# Run for 10 seconds:
siege -b --no-log -t 10S http://127.0.0.1:8080/`,
        expected:
`# Sample (your numbers will vary)
Transactions:                  500 hits
Availability:                100.00 %
Elapsed time:                  10.00 secs
Data transferred:               0.85 MB
Response time:                  0.01 secs
Transaction rate:              50.00 trans/sec
Throughput:                     0.08 MB/sec
Concurrency:                    0.50
Longest transaction:            0.03
Shortest transaction:           0.00`,
        notes:
`• Availability should be high (≥ 99.5%) for a PASS.
• Use <span class="kbd">--no-log</span> to avoid file locks; adjust duration with <span class="kbd">-t 30S</span> or <span class="kbd">-t 1M</span>.`
      }
    };

    const g = GUIDES[id];
    const $ = s => document.querySelector(s);
    if (!g) {
      $('#title').textContent = 'Guide not found';
      $('#desc').textContent = 'Invalid ID. Go back and choose another CLI test.';
      $('#cmd').textContent = '—';
      $('#expected').textContent = '—';
      $('#notes').textContent = '—';
    } else {
      $('#title').textContent = g.title + ' (CLI)';
      $('#desc').textContent = g.desc;
      $('#cmd').textContent = g.cmd;
      $('#expected').textContent = g.expected;
      $('#notes').innerHTML = g.notes;
    }
  </script>
</body>
</html>
