<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Uploads</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    color: #e8ecf1;
    background: #000 url("/images/serve10.jpg") no-repeat center center fixed;
    background-size: cover;   /* cover the whole viewport */
    min-height: 100vh;
    padding: 20px;
  }
  header {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  h1 { margin: 0; color:#ffd700 }
  .btn, button.btn {
    padding:6px 10px; border-radius:8px; border:1px solid #3a465f;
    background:#1b2233; color:#e8ecf1; cursor:pointer;
    text-decoration:none; font-weight:600;
  }
  .btn:hover, button.btn:hover { background:#24304a }
  .danger { border-color:#734040; background:#2a1717 }
  .danger:hover { background:#3a1e1e }
  .muted { color:#9aa7b2; font-size:14px }

  table {
    width:100%; border-collapse: collapse; background:#111826;
    border:1px solid #283143; border-radius:12px; overflow:hidden
  }
  th, td { padding: 10px 12px; border-bottom:1px solid #283143 }
  tr:last-child td { border-bottom: none }
</style>
</head>
<body>
  <header>
    <h1>Uploads</h1>
    <a class="btn" href="/">← Back to Home</a>
  </header>

  <p class="muted">Click “Open” to view. Use “Delete” to remove.</p>

  <table id="tbl" aria-label="Uploaded files">
    <thead><tr><th>File</th><th style="width:200px">Actions</th></tr></thead>
    <tbody id="rows"><tr><td class="muted" colspan="2">Loading…</td></tr></tbody>
  </table>

<script>
(function () {
  // Always use the same public base path (switch to "/uploads/" if your config uses that alias)
  const BASE = "/files/";

  function sanitizeName(name) {
    // Strip dangerous sequences; do not allow traversal or subfolders
    if (!name) return "";
    name = name.replace(/\r|\n/g, "");
    if (name.includes("..")) return "";
    if (name.includes("/")) return "";
    return name;
  }

  async function list() {
    // Read the autoindex HTML and extract file links
    const res = await fetch(BASE, { cache: "no-store" });
    if (!res.ok) throw new Error("Failed to list: " + res.status);
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, "text/html");

    // Autoindex usually renders <a href="filename.ext">filename.ext</a>
    const links = [...doc.querySelectorAll("a")]
      .map(a => (a.getAttribute("href") || "").trim())
      .filter(h => h && h !== "../");

    const tbody = document.getElementById("rows");
    tbody.innerHTML = "";
    if (!links.length) {
      tbody.innerHTML = '<tr><td class="muted" colspan="2">No files.</td></tr>';
      return;
    }

    for (const href of links) {
      // Keep only the file name (no relative paths)
      const raw = href.split("/").pop();
      const name = sanitizeName(decodeURIComponent(raw));
      if (!name) continue;

      const tr = document.createElement("tr");

      const tdName = document.createElement("td");
      tdName.textContent = name;

      const tdAct = document.createElement("td");

      const open = document.createElement("a");
      open.className = "btn";
      // IMPORTANT: encode ONLY the file name, not the slash
      open.href = BASE + encodeURIComponent(name);
      open.target = "_blank";
      open.rel = "noopener";
      open.textContent = "Open";

      const del = document.createElement("button");
      del.className = "btn danger";
      del.textContent = "Delete";
      del.onclick = async () => {
        if (!confirm(`Delete "${name}"?`)) return;
        const url = BASE + encodeURIComponent(name); // Proper DELETE URL
        const res = await fetch(url, { method: "DELETE" });
        if (res.ok) {
          tr.remove();
          if (!tbody.children.length) {
            tbody.innerHTML = '<tr><td class="muted" colspan="2">No files.</td></tr>';
          }
        } else {
          const msg = await res.text().catch(() => "");
          alert(`Deletion failed (${res.status}).\n${msg}`);
        }
      };

      tdAct.appendChild(open);
      tdAct.appendChild(document.createTextNode(" "));
      tdAct.appendChild(del);

      tr.appendChild(tdName);
      tr.appendChild(tdAct);
      tbody.appendChild(tr);
    }
  }

  list().catch(err => {
    document.getElementById("rows").innerHTML =
      `<tr><td class="muted" colspan="2">Error: ${err.message}</td></tr>`;
  });
})();
</script>
</body>
</html>
