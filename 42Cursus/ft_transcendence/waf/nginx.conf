server {
    listen ${PORT};
    server_name localhost;

    # ── ModSecurity (OWASP CRS carregado pela imagem base) ─────────────────
    modsecurity on;

    # ── Limites de proteção contra buffer overflow / DoS ──────────────────
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Health check endpoint (bypass ModSecurity) ─────────────────────────
    location = /healthz {
        modsecurity off;
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── API: proxy para o backend (HTTPS, cert autoassinado) ───────────────
    location /api {
        proxy_pass https://backend:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # ── WebSocket: proxy para o backend (STOMP/SockJS) ────────────────────
    location /ws {
        proxy_pass https://backend:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        # ModSecurity off para WebSocket upgrades (protocolo não-HTTP)
        modsecurity off;
    }

    # ── Frontend: tudo o mais vai para o Vite dev server ──────────────────
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
