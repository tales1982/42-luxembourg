services:
  ftp-server:
    build: ./ftp
    container_name: inquisitor-ftp-server
    networks:
      mitmnet:
        ipv4_address: 172.28.0.10
    mac_address: "02:42:ac:1c:00:0a"

  client:
    build: ./client
    container_name: inquisitor-client
    depends_on:
      - ftp-server
      - inquisitor
    networks:
      mitmnet:
        ipv4_address: 172.28.0.20
    mac_address: "02:42:ac:1c:00:14"

  inquisitor:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: inquisitor-attacker
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - ftp-server
    networks:
      mitmnet:
        ipv4_address: 172.28.0.30
    # <IP-src> <MAC-src> <IP-target> <MAC-target> = client <-> ftp-server
    command: ["-v", "172.28.0.20", "02:42:ac:1c:00:14", "172.28.0.10", "02:42:ac:1c:00:0a"]

networks:
  mitmnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
