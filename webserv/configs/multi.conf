# DEFAULT (porta 8080) — usado pelo checklist (BASE_URL 127.0.0.1:8080)
server {
    listen 0.0.0.0:8080;
    server_name _ localhost 127.0.0.1 default.local;
    root ./www;
    client_max_body_size 8m;

    error_page 404 ./errors/404.html;
    error_page 500 ./errors/500.html;

    # HOME
    location / {
        methods GET HEAD;
        index index.html;     # ./www/index.html
        autoindex off;
    }

    # FILES (autoindex + upload)
    location /files/ {
        methods GET HEAD POST DELETE;
        # herda root ./www -> serve ./www/files/...
        index files/index.html;
        autoindex on;
        upload on;
        upload_store ./www/uploads;
    }

    # UPLOADS (lista arquivos enviados)
    location /uploads/ {
        methods GET HEAD DELETE;
        autoindex on;        # lista ./www/uploads
    }

    # CGI (python)
    location /cgi/ {
        methods GET POST;
        cgi_ext .py;
        cgi_executor /usr/bin/python3;
        autoindex off;
    }

    # Redirect /old -> /new
    location /old { return 301 /new; }
    location /new {
        methods GET HEAD;
        index index.html;    # ./www/new/index.html
        autoindex off;
    }
}

# VIRTUAL HOST por NOME (mesma porta 8080)
server {
    listen 0.0.0.0:8081;
    server_name sitea.local;
    root ./www/siteA;

    location / { methods GET HEAD; index index.html; autoindex off; }
}

# OUTRA PORTA (8081)
server {
    listen 0.0.0.0:8082;
    server_name siteb.local;
    root ./www/siteB;

    location / { methods GET HEAD; index index.html; autoindex off; }
}

