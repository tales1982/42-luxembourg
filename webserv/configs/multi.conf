# DEFAULT (porta 8080)
server {
    listen 0.0.0.0:8080;
    server_name _ localhost 127.0.0.1 default.local;
    root ./www/default;
    client_max_body_size 8m;

    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }
}

# VIRTUAL HOST por NOME (mesma porta 8080)
server {
    listen 0.0.0.0:8080;
    server_name sitea.local;
    root ./www/siteA;

    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }
}

# OUTRA PORTA (8081)
server {
    listen 0.0.0.0:8081;
    server_name siteb.local _;
    root ./www/siteB;

    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }
}
