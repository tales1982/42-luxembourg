# =========================
# configs/example.conf
# =========================
# Arquivo principal de configuração do Webserv
# - Porta padrão: 8080 (default/local)
# - Inclui upload de arquivos, listagem de uploads, páginas CGI
# - Inclui redirects e páginas de erro customizadas
# - Inclui vhosts extras (siteA, siteB) em outras portas
# =========================

# -------------------------
# SERVIDOR PRINCIPAL (porta 8080)
# -------------------------
server {
    listen 0.0.0.0:8080;
    server_name default.local localhost 127.0.0.1 _;
    root ./www;
    client_max_body_size 8m;

    # Páginas de erro (personalizadas em ./errors)
    error_page 404 ./errors/404.html;
    error_page 405 ./errors/405.html;
    error_page 413 ./errors/413.html;
    error_page 500 ./errors/500.html;
    error_page 502 ./errors/502.html;
    error_page 504 ./errors/504.html;

    # -------------------------
    # FILES
    # /files/ -> permite listar (autoindex), enviar (POST raw) e apagar arquivos
    # Salva os uploads em ./data
    # -------------------------
    location /files/ {
        methods GET HEAD POST DELETE;
        root ./data; 
        autoindex on;
        upload on;
        upload_store ./data;
    }
    # Protege acesso a /files sem barra final (faz redirect para /files/)
    location /files { return 301 /files/; }

    # -------------------------
    # VIEW_UPLOADS (UI de listagem)
    # Serve ./www/view_uploads/index.html (UI com JS que consome /uploads/)
    # -------------------------
    location /view_uploads/ {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }

    # -------------------------
    # UPLOADS (listagem crua)
    # /uploads/ -> mapeado diretamente para ./data
    # Fornece links <a href="..."> gerados via autoindex
    # Suporta GET/HEAD/DELETE
    # -------------------------
    location /uploads/ {
        methods GET HEAD DELETE;
        root ./data;             # /uploads/foo -> ./data/foo
        autoindex on;            # lista simples (parseada pela UI /view_uploads/)
    }

    # -------------------------
    # SEND_FILES (UI de upload)
    # Serve ./www/send_files/index.html
    # -------------------------
    location /send_files/ {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }

    # -------------------------
    # CGI em Python
    # Executa scripts .py em ./www/cgi/
    # Exemplo: /cgi/echo.py
    # -------------------------
    location /cgi/ {
        methods GET POST;
        cgi_ext .py;
        cgi_executor /usr/bin/python3;
        autoindex off;
    }

    # -------------------------
    # Redirects
    # /old -> redireciona permanentemente (301) para /new
    # -------------------------
    location /old { return 301 /new; }

    # -------------------------
    # NEW
    # Página em ./www/new/index.html
    # -------------------------
    location /new {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }

    # -------------------------
    # HOME
    # Página inicial em ./www/index.html
    # (declarado por último para não sobrepor outros blocos)
    # -------------------------
    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }

    location /uploads/ {
        methods GET HEAD DELETE;
        root ./data;      # /uploads/foo -> ./data/foo
        autoindex on;
    }

    location /files { return 301 /files/; }
}

# -------------------------
# VHOST: sitea.local (porta 8081)
# Raiz em ./www/siteA
# Teste de multi-host por nome (server_name)
# -------------------------
server {
    listen 0.0.0.0:8081;
    server_name sitea.local;
    root ./www/siteA;

    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }
}

# -------------------------
# VHOST: siteb.local (porta 8082)
# Raiz em ./www/siteB
# Teste de multi-host em outra porta
# -------------------------
server {
    listen 0.0.0.0:8082;
    server_name siteb.local;
    root ./www/siteB;

    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }
}
