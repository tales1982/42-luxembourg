server {
    listen 0.0.0.0:8080;
    server_name default.local localhost 127.0.0.1 _;
    root ./www;
    client_max_body_size 8m;

    error_page 404 ./errors/404.html;
    error_page 500 ./errors/500.html;

    # HOME
    location / {
        methods GET HEAD;
        index index.html;      # ./www/index.html
        autoindex off;
    }

    # FILES
    location /files/ {
        methods GET HEAD POST DELETE;
        # root (herda ./www)
        index  index.html;     # ./www/files/index.html
        autoindex on;
        upload on;
        upload_store ./www/uploads;
    }

    # UPLOADS
    location /uploads/ {
        methods GET HEAD DELETE;
        # root (herda ./www)
        autoindex on;          # lista ./www/uploads
    }

    # CGI
    location /cgi/ {
        methods GET POST;
        # root (herda ./www); scripts ficam em ./www/cgi/...
        cgi_ext .py;
        cgi_executor /usr/bin/python3;
        autoindex off;
    }

    location /old { return 301 /new; }
    location /new {
        methods GET HEAD;
        index index.html;      # ./www/new/index.html
        autoindex off;
    }

    # CGI em Python (.py)
location /cgi/ {
    methods GET POST;
    # herda root ./www
    cgi_ext .py;
    cgi_executor /usr/bin/python3;
    autoindex off;
}

# CGI nativo/binário (.cgi)
location /cgi-bin/ {
    methods GET POST;
    # herda root ./www
    cgi_ext .cgi;          # tudo que terminar com .cgi é CGI
    # ATENÇÃO: sem cgi_executor aqui (auto-exec do binário)
    autoindex off;
}

}
