server {
    listen 0.0.0.0:8080;
    server_name default.local localhost 127.0.0.1 _;
    root ./www;
    client_max_body_size 8m;

    error_page 404 ./errors/404.html;
    error_page 500 ./errors/500.html;

    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }

    # para listar e fazer upload (POST) em /files/
    location /files/ {
        methods GET HEAD POST DELETE;
        root ./www/files;            # /files/foo -> ./www/files/foo
        autoindex on;
        autoindex on;
        upload on;
        upload_store ./www/uploads;  # salva aqui
    }

    # **NOVO**: permitir apagar o arquivo salvo via /uploads/<nome>
    location /uploads/ {
        methods GET HEAD DELETE;     # <— precisa do DELETE para 204
        root ./www/uploads;          # /uploads/foo -> ./www/uploads/foo
        autoindex on;
    }

    # **AJUSTE**: raiz do CGI apontando para a pasta exata do script
    location /cgi/ {
        methods GET POST;
        root ./www/cgi;              # /cgi/echo.py -> ./www/cgi/echo.py
        cgi_ext .py;
        cgi_executor /usr/bin/python3;
        autoindex off;
    }

    location /old {
        return 301 /new;
    }

    location /new {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }
}
