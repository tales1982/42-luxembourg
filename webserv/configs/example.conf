# =========================
# configs/example.conf
# =========================

# -------------------------
# DEFAULT (porta 8080)
# Usado pelo checklist com BASE_URL=http://127.0.0.1:8080
# Possui /files (autoindex + upload), /uploads, /cgi (python) e redirect /old -> /new
# -------------------------
server {
    listen 0.0.0.0:8080;
    server_name default.local localhost 127.0.0.1 _;
    root ./www;
    client_max_body_size 8m;

    # Páginas de erro (apontam para ./errors)
    error_page 404 ./errors/404.html;
    error_page 500 ./errors/500.html;

    # HOME (./www/index.html)
    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }

    # FILES (./www/files) — autoindex + upload "raw"
    location /files/ {
        methods GET HEAD POST DELETE;
        # herda root ./www -> serve ./www/files/...
        index files/index.html;
        autoindex on;

        # Upload simples (POST com corpo cru)
        upload on;
        upload_store ./www/uploads;   # arquivos gravados em ./www/uploads
    }

    # UPLOADS (lista o conteúdo de ./www/uploads)
    location /uploads/ {
        methods GET HEAD DELETE;
        autoindex on;
    }

    # CGI em Python (scripts em ./www/cgi/*.py)
    location /cgi/ {
        methods GET POST;
        # herda root ./www -> ./www/cgi/echo.py, etc.
        cgi_ext .py;
        cgi_executor /usr/bin/python3;
        autoindex off;
    }

    # (Opcional) CGI binário nativo (.cgi) em ./www/cgi-bin/
    # Descomente se quiser servir executáveis .cgi diretamente.
    # location /cgi-bin/ {
    #     methods GET POST;
    #     cgi_ext .cgi;          # tudo que terminar com .cgi é CGI
    #     # sem cgi_executor: executa o binário diretamente
    #     autoindex off;
    # }

    # Redirect /old -> /new
    location /old { return 301 /new; }

    # NEW (./www/new/index.html)
    location /new {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }
}

# -------------------------
# VHOST: sitea.local (porta 8081)
# Raiz em ./www/siteA (conteúdo simples para o teste de multi-host)
# -------------------------
server {
    listen 0.0.0.0:8081;
    server_name sitea.local;
    root ./www/siteA;

    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }
}

# -------------------------
# VHOST: siteb.local (porta 8082)
# Raiz em ./www/siteB (conteúdo simples para o teste de multi-host)
# -------------------------
server {
    listen 0.0.0.0:8082;
    server_name siteb.local;
    root ./www/siteB;

    location / {
        methods GET HEAD;
        index index.html;
        autoindex off;
    }
}
