# configs/ubuntu_tester.conf
server {
    listen 0.0.0.0:8080;
    server_name localhost 127.0.0.1 _;
    root ./www;

    # /  -> só GET
    location / {
        methods GET;
        #index index.html;
    }

    # /post_body -> POST com body máximo 100 bytes
    location /post_body {
        methods POST;
        client_max_body_size 100;
    }

    # /put_test/* -> PUT salva arquivos (se implementou PUT)
    location /put_test/ {
        methods PUT;
        upload_on on;
        upload_store ./uploads/put_test;
    }

    # /directory/ -> raiz YoupiBanane, index = youpi.bad_extension,
    #                .bla via CGI (POST) usando o executável do tester
    location /directory/ {
        methods GET;
        root ./YoupiBanane;
        index youpi.bad_extension;

        cgi on;
        cgi_ext .bla;
        cgi_exec ./cgi-bin/cgi_test;   # symlink p/ test/scripts/ubuntu_cgi_tester
    }
}
