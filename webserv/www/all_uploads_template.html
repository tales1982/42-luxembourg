<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Index de {{ PATH }}</title>
  <style>
    :root {
      --bg-start: #4ba1b7;
      --bg-end: #184830;
      --box-bg: rgba(255, 255, 255, 0.15);
      --box-border: rgba(255, 255, 255, 0.25);
      --text-main: #ffffff;
      --text-secondary: #e0e0e0;
      --link: #00ffe7;
      --hover-bg: rgba(255, 255, 255, 0.05);
      --btn-start: #ff6a00;
      --btn-end: #ee0979;
      --btn-text: #ffffff;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(120deg, var(--bg-start), var(--bg-end));
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--box-bg);
      border: 1px solid var(--box-border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #ffcc70, #ff7eb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    p {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    ul {
      list-style: none;
      padding-left: 0;
      margin-bottom: 2rem;
    }

    li {
      background: var(--hover-bg);
      border-left: 4px solid var(--link);
      margin: 0.5rem 0;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s ease;
    }

    li:hover {
      transform: translateX(5px);
    }

    li a {
      text-decoration: none;
      color: var(--link);
      font-weight: 500;
    }

    .file-icon {
      margin-right: 0.5rem;
    }

    .links {
      margin-top: 2rem;
    }

    .links a {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      font-weight: bold;
      font-size: 1rem;
      text-decoration: none;
      color: var(--btn-text);
      background: linear-gradient(45deg, var(--btn-start), var(--btn-end));
      border-radius: 50px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .links a:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🗂️ Index de {{PATH}}</h1>
    <p>Nombre total de fichiers : <strong>{{COUNT}}</strong></p>

    <ul id="file-list">
      {{LIST}}
    </ul>

    <script>
      function deleteFile(path, liElement) {
        if (!confirm("Êtes-vous sûr de vouloir supprimer ce fichier ?")) return;

        fetch(path, { method: 'DELETE' })
          .then(response => {
            if (response.status === 204) {
              liElement.remove();
              alert("Fichier supprimé avec succès.");
            } else {
              alert("Erreur lors de la suppression : " + response.status);
            }
          })
          .catch(() => {
            alert("Erreur de connexion avec le serveur.");
          });
      }
    </script>

    <div class="links">
      <a href="http://localhost:8080/">⬅ Retour à l'accueil</a>
      <a href="http://localhost:8080/tests/index_tests.html">⬅ Retour à la  page tests</a>
    </div>
  </div>
</body>
</html>
