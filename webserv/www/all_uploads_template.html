<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Index of {{ PATH }}</title>
  <style>
    :root {
      --bg-page: #f0f4f8;
      --bg-box: #ffffff;
      --accent-start: #6a11cb;
      --accent-end: #2575fc;
      --text-main: #2d3436;
      --text-link: #2575fc;
      --hover-bg: #e0e6f1;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #17dd6a, #9ca521);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      background: var(--bg-box);
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border-bottom: 2px solid var(--accent-end);
      padding-bottom: 0.5rem;
    }
    ul {
      list-style: none;
    }
    li {
      margin: 0.75rem 0;
      padding: 0.75rem 1rem;
      background-color: #f9f9f9;
      border-left: 4px solid var(--accent-start);
      border-radius: 6px;
      transition: background-color 0.2s, transform 0.2s;
    }
    li:hover {
      background-color: var(--hover-bg);
      transform: translateX(6px);
    }
    a {
      text-decoration: none;
      color: var(--text-link);
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
      color: var(--accent-end);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Index of {{PATH}}</h1>
    <ul>
      {{LIST}}
    </ul>
  </div>
</body>
</html>
