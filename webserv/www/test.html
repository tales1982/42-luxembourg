<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Page de Test</title>
  <style>
    :root {
      /* fundo da página */
      --bg-start: #1e3c72;
      --bg-end:   #2a5298;

      /* caixa principal */
      --box-bg: rgba(255, 255, 255, 0.15);
      --box-border: rgba(255, 255, 255, 0.3);

      /* tipografia */
      --text-main: #ffffff;
      --text-secondary: #e0e0e0;

      /* botão */
      --btn-start: #ff416c;
      --btn-end:   #ff4b2b;
      --btn-text:  #ffffff;
    }

    /* reset mínimo */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(120deg, var(--bg-start), var(--bg-end));
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
    }

    .container {
      position: relative;
      max-width: 400px;
      width: 90%;
      padding: 2rem;
      border-radius: 16px;
      background: var(--box-bg);
      border: 1px solid var(--box-border);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      text-align: center;
    }

    p {
      font-size: 1.25rem;
      line-height: 1.5;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    .links {
      margin-top: 1rem;
    }

    .links a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(45deg, var(--btn-start), var(--btn-end));
      color: var(--btn-text);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .links a:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <p>🧪 Ceci est une page de test</p>
    <div class="links">
      <a href="http://localhost:8080/">Aller vers la Home</a>
    </div>
  </div>
</body>
</html>
