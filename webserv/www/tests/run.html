<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Webserv — Run Test</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      margin:0; font-family: system-ui,Segoe UI,Roboto,Ubuntu;
      color:#e8f0ff;
      background:#0b1522 url("/images/serve5.jpg") no-repeat center center fixed;
      background-size:cover;
    }
    .wrap { max-width:900px; margin:0 auto; padding:32px 16px; background:rgba(0,0,0,.6); border-radius:16px; margin-top:40px; }
    a.back { color:#ffd54a; text-decoration:none; font-weight:700; }
    h1 { margin:16px 0; font-size:26px; }
    p { color:#cfd8dc; }
    pre {
      background:rgba(0,0,0,.35); padding:12px; border-radius:12px; overflow:auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color:#9fe8ff;
    }
    button {
      margin-top:16px; padding:12px 20px; border:none; border-radius:8px;
      background:#ffd54a; color:#000; font-weight:bold; cursor:pointer;
    }
    button:hover { background:#ffb300; }
    #result { margin-top:20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Back to tests</a>
    <h1 id="title">Test</h1>
    <p id="desc"></p>
    <button onclick="runTest()">Run test</button>
    <div id="result"></div>
  </div>

  <script>
    const id = new URLSearchParams(location.search).get('id') || '';

    // Test definitions
    const TESTS = {
  "get":   { title:"Basic GET (200 + Content-Type)", desc:"Request / and validate 200 + Content-Type.", req:{ url:"/", method:"GET", expect:200 } },
  "head":  { title:"HEAD without body", desc:"Check status 200 and body 0 bytes.", req:{ url:"/", method:"HEAD", expect:200 } },

  "400": { title:"400 Bad Request (CGI)", desc:"/cgi/bad_request.py should return 400.", req:{ url:"/cgi/bad_request.py", method:"GET", expect:400 } },
  "403": { title:"403 Forbidden", desc:"GET /secret/ (no index, autoindex off).", req:{ url:"/secret/", method:"GET", expect:403 } },
  "404": { title:"Custom 404", desc:"Request /nao_existe and expect 404.", req:{ url:"/nao_existe", method:"GET", expect:404 } },
  "405": { title:"405 Method Not Allowed", desc:"DELETE on /new/index.html should return 405.", req:{ url:"/new/index.html", method:"DELETE", expect:405 } },
  "413": { title:"Body limit (413)", desc:"Large POST should return 413.", req:{ url:"/cgi/echo.py", method:"POST", body:"X".repeat(1024*1024*11), headers:{ "Content-Type":"application/octet-stream" }, expect:413 } },
  "500": { title:"500 Internal Server Error (CGI)", desc:"/cgi/fail500.py should return 500.", req:{ url:"/cgi/fail500.py", method:"GET", expect:500 } },
  "502": { title:"502 Bad Gateway (CGI)", desc:"/cgi/bad_gateway.py should return 502.", req:{ url:"/cgi/bad_gateway.py", method:"GET", expect:502 } },
  "504": { title:"504 Gateway Timeout (CGI)", desc:"/cgi/slow.py should time out.", req:{ url:"/cgi/slow.py", method:"GET", expect:504 } },

  "autoindex": { title:"Autoindex", desc:"Directory listing enabled at /files/.", req:{ url:"/files/", method:"GET", expect:200 } },
  "redirect":  { title:"Redirect (3xx + Location)", desc:"GET /old should redirect.", req:{ url:"/old", method:"GET", expect:301 } },
  "upload":    { title:"Raw upload", desc:"POST on /files/ should return 200/201.", req:{ url:"/files/", method:"POST", body:"hello webserv", headers:{ "Content-Type":"text/plain" }, expect:[200,201] } },
  "cgi-get":   { title:"CGI GET", desc:"GET /cgi/echo.py should return 200.", req:{ url:"/cgi/echo.py", method:"GET", expect:200 } },
  "cgi-post":  { title:"CGI POST", desc:"POST /cgi/echo.py should return 200.", req:{ url:"/cgi/echo.py", method:"POST", body:"msg=hello", headers:{ "Content-Type":"application/x-www-form-urlencoded" }, expect:200 } }
};


    const t = TESTS[id];
    if (!t) {
      document.getElementById("title").textContent = "Test not found";
      document.getElementById("desc").textContent = "Invalid ID. Go back and choose another test.";
    } else {
      document.getElementById("title").textContent = "Test: " + t.title;
      document.getElementById("desc").textContent = t.desc;
    }

    async function runTest(){
      if (!t) return;
      const resultEl = document.getElementById("result");
      resultEl.innerHTML = "<em>Running...</em>";

      try {
        const opt = { method:t.req.method, cache:"no-store", headers:t.req.headers||{} };
        if (t.req.body) opt.body = t.req.body;

        const res = await fetch(t.req.url, opt);
        const ct = res.headers.get("Content-Type") || "(no Content-Type)";
        const expect = Array.isArray(t.req.expect) ? t.req.expect : [t.req.expect];

        let statusOk = expect.includes(res.status);
        let body = "";
        if (t.req.method !== "HEAD") {
          body = await res.text();
        }

        resultEl.innerHTML = `
          <p>Status: <strong>${res.status} ${res.statusText}</strong> 
            (expected: ${expect.join(" or ")}) 
            ${statusOk ? "✅" : "❌"}
          </p>
          <p>Content-Type: <code>${ct}</code></p>
          <h3>Body preview:</h3>
          <pre id="bodyPreview"></pre>
        `;

        document.getElementById("bodyPreview").textContent =
          body.slice(0,600) + (body.length>600 ? "\n…(truncated)" : "");

      } catch(e){
        resultEl.innerHTML = "<p style='color:#ff6b6b'>Error: "+e+"</p>";
      }
    }
  </script>
</body>
</html>
