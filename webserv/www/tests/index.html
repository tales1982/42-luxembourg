<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Webserv — Test Suite</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --txt:#e8f0ff; --muted:#cfd8dc; --accent:#ffd54a; --neon:#00c8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial;
      color: var(--txt);
      background: #0b1522 url("/images/serve5.jpg") no-repeat center center fixed;
      background-size: cover;
    }
    header { padding: 28px 16px; text-align:center; background:rgba(0,0,0,0.55); }
    .title { font-size: 28px; font-weight: 800; letter-spacing: .3px; }
    .subtitle { margin-top: 6px; color: rgba(255,255,255,.75); font-size: 14px; }
    .grid {
      display:grid; gap:16px; padding: 20px 16px 40px;
      grid-template-columns: repeat(5, 1fr); /* 5 per row */
      max-width: 1600px; margin: 0 auto;
    }
    .card {
      background: rgba(0,0,0,0.58);
      border: 1px solid rgba(0, 200, 255, 0.25);
      border-radius: 16px; padding: 18px;
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
      backdrop-filter: blur(2px);
    }
    .card:hover { transform: translateY(-2px); border-color: rgba(0,200,255,.85); box-shadow: 0 0 12px rgba(0,200,255,.35); }
    .card.cli { border: 1px dashed rgba(255,255,255,.28); background: rgba(0,0,0,.66); }
    .card.cli:hover { border-color:#ffd54a; box-shadow: 0 0 12px rgba(255,213,74,.45); }
    .card.home { border:1px solid rgba(144,238,144,.35); background: rgba(0,0,0,.62); }
    .card.home:hover { border-color: rgba(144,238,144,.9); box-shadow: 0 0 12px rgba(144,238,144,.4); }

    .tag { display:inline-block; font-size:12px; padding:4px 8px; border-radius:999px;
           background: rgba(0,200,255,.18); color:#9fe8ff; }
    .tag.cli { background: rgba(255,213,74,.18); color:#ffd54a; font-weight:700; }
    .tag.home { background: rgba(144,238,144,.18); color:#b5ffb5; }

    .card h3 { margin:10px 0 8px; font-size:18px; }
    .desc { color: var(--muted); font-size: 14px; min-height: 44px; }
    .actions { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
    .btn {
      appearance:none; border:none; cursor:pointer;
      background: var(--accent); color:#0b0b0b; padding:10px 12px;
      border-radius:10px; font-weight:700; font-size:14px; text-decoration:none;
    }
    .btn.secondary { background: transparent; color:#e0f7ff; border:1px solid rgba(0,200,255,.5); }
    .btn.cli { background: transparent; color:#ffd54a; border:1px dashed rgba(255,213,74,.6); }
    .btn.home { background: #90ee90; color:#072; }
    footer { text-align:center; color: rgba(255,255,255,.8); font-size:12px; padding: 8px 0 18px; background:rgba(0,0,0,0.45); }
    @media (max-width: 1280px){ .grid{ grid-template-columns: repeat(4,1fr);} }
    @media (max-width: 980px){ .grid{ grid-template-columns: repeat(3,1fr);} }
    @media (max-width: 720px){ .grid{ grid-template-columns: repeat(2,1fr);} }
    @media (max-width: 460px){ .grid{ grid-template-columns: 1fr;} }
  </style>
</head>
<body>
  <header>
    <div class="title">Webserv — Test Suite</div>
    <div class="subtitle">Click on a card to run. The “CLI” cards open a guide with commands.</div>
  </header>

  <main class="grid" id="grid"></main>

  <footer>Some tests require the command line (vhost, siege, UNKNOWN).</footer>

  <script>
    // Browser-executable tests
    const TESTS_BROWSER = [
      { id:"get",       tag:"HTTP",   title:"Basic GET (200 + Content-Type)", desc:"Request / and validate 200 + Content-Type." },
      { id:"head",      tag:"HTTP",   title:"HEAD without body",              desc:"Check status 200 and body with 0 bytes." },
      { id:"404",       tag:"HTTP",   title:"Custom 404",                     desc:"Request /not_found and expect 404." },
      { id:"autoindex", tag:"Static", title:"Autoindex",                      desc:"Directory listing enabled on /files/." },
      { id:"redirect",  tag:"HTTP",   title:"Redirect (3xx + Location)",      desc:"GET /old should redirect with Location." },
      { id:"405",       tag:"HTTP",   title:"405 Method Not Allowed",         desc:"DELETE /new/index.html should return 405." },
      { id:"upload",    tag:"Upload", title:"Raw upload (POST /files/)",      desc:"POST text/plain and expect 200/201." },
      { id:"413",       tag:"Limits", title:"Body limit (413)",               desc:"POST large payload and expect 413." },
      { id:"cgi-get",   tag:"CGI",    title:"CGI GET",                        desc:"GET /cgi/echo.py returns 200." },
      { id:"cgi-post",  tag:"CGI",    title:"CGI POST",                       desc:"POST /cgi/echo.py returns 200." }
    ];

    // CLI tests (go to guide.html)
    const TESTS_CLI = [
      { id:"vhost",     tag:"CLI",    title:"🖥️ Multi-host (server_name)", desc:"Test server_name with --resolve (curl).", cli:true },
      { id:"unknown",   tag:"CLI",    title:"🖥️ UNKNOWN method",           desc:"Send method 'FOO' with curl.", cli:true },
      { id:"siege",     tag:"CLI",    title:"🖥️ Stress (siege)",           desc:"Run siege load test for 10s.", cli:true },
    ];

    // Home card
    const CARD_HOME = {
      title:"Go to Home",
      desc:"Return to the main Webserv page.",
      href:"/",
    };

    const grid = document.getElementById('grid');

    function cardHtml(t){
      const isCli = !!t.cli;
      const tagClass = isCli ? 'tag cli' : 'tag';
      const cardClass = isCli ? 'card cli' : 'card';
      const hrefRun   = isCli ? `guide.html?id=${encodeURIComponent(t.id)}` : `run.html?id=${encodeURIComponent(t.id)}`;
      const hrefDet   = isCli ? `guide.html?id=${encodeURIComponent(t.id)}#detalhes` : `run.html?id=${encodeURIComponent(t.id)}&verbose=1`;
      const btnClass  = isCli ? 'btn cli' : 'btn';
      const btnText   = isCli ? 'Open guide (CLI)' : 'Run';
      const detText   = 'See details';

      return `
        <article class="${cardClass}">
          <span class="${tagClass}">${t.tag || (isCli ? 'CLI' : 'HTTP')}</span>
          <h3>${t.title}</h3>
          <p class="desc">${t.desc}</p>
          <div class="actions">
            <a class="${btnClass}" href="${hrefRun}">${btnText}</a>
            <a class="btn secondary" href="${hrefDet}">${detText}</a>
          </div>
        </article>
      `;
    }

    const homeHtml = `
      <article class="card home">
        <span class="tag home">NAV</span>
        <h3>🏠 ${CARD_HOME.title}</h3>
        <p class="desc">${CARD_HOME.desc}</p>
        <div class="actions">
          <a class="btn home" href="${CARD_HOME.href}">Open Home</a>
        </div>
      </article>
    `;

    grid.innerHTML =
      TESTS_BROWSER.map(cardHtml).join('') +
      TESTS_CLI.map(cardHtml).join('') +
      homeHtml;
  </script>
</body>
</html>
