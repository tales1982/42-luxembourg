<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Execution Guide (CLI)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --bg:#0e1a2a; --panel:#13233a; --txt:#e8f0ff; --muted:#e0c4c4; --accent:#ffd54a; }
    * { box-sizing:border-box; }
    body{
      margin:0; font-family:system-ui,Segoe UI,Roboto,Ubuntu; color:var(--txt);
      background: #0b1522 url("/images/serve8.jpg") no-repeat center center fixed;
      background-size: cover;
    }
    .wrap{ max-width:900px; margin:0 auto; padding:24px 16px 40px; background:rgba(0,0,0,0.55); border-radius:16px; }
    a.back{ color:var(--accent); text-decoration:none; font-weight:700; }
    h1{ margin:12px 0 8px; font-size:24px; }
    p.muted{ color:var(--muted); }
    .card{ margin-top:14px; background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      border:1px dashed rgba(255,255,255,.35); border-radius:16px; padding:16px; }
    pre{ background:rgba(0,0,0,.35); padding:12px; border-radius:12px; overflow:auto; color:#fff; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tip{ color:var(--muted); font-size:14px; }
    .kbd{ padding:2px 6px; border:1px solid rgba(255, 255, 255, 0.418); border-radius:6px; background:rgba(255,255,255,.06); }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Back to tests</a>
    <h1 id="title">Guide</h1>
    <p class="muted" id="desc">This test requires the command line. Follow the steps below.</p>

    <section class="card" id="conteudo">
      <h3>Commands</h3>
      <pre id="cmd">—</pre>
      <h3 id="detalhes">Notes</h3>
      <div id="notes" class="tip">—</div>
    </section>
  </div>

  <script>
    const id = new URLSearchParams(location.search).get('id') || '';

    const GUIDES = {
      'vhost': {
        title: 'Multi-host (server_name)',
        desc: 'Validates that each virtual host responds according to its server_name.',
        cmd:
`# Test Host A:
curl -s --resolve sitea.local:8081:127.0.0.1 http://sitea.local:8081/

# Test Host B:
curl -s --resolve siteb.local:8082:127.0.0.1 http://siteb.local:8082/`,
        notes:
`• Adjust domains and ports according to your \`configs/example.conf\`.
• The <span class="kbd">--resolve</span> parameter forces DNS to 127.0.0.1 without editing /etc/hosts.
• Check if the response body contains the expected text (e.g., “SITE A (hostname)”).`
      },
      'unknown': {
        title: 'UNKNOWN method',
        desc: 'Ensures the server does not crash with unknown methods.',
        cmd:
`curl -i -X FOO http://127.0.0.1:8080/`,
        notes:
`• The expected result is <span class="kbd">405 Method Not Allowed</span> (or 400, depending on your validation).
• If it returns 405, also check the <span class="kbd">Allow</span> header with the supported methods.`
      },
      'siege': {
        title: 'Stress (siege)',
        desc: 'Runs a short load test and measures availability.',
        cmd:
`# Install siege (Ubuntu/Debian):
sudo apt-get update && sudo apt-get install -y siege

# Run for 10 seconds:
siege -b --no-log -t 10S http://127.0.0.1:8080/`,
        notes:
`• You can adjust the target and duration: <span class="kbd">-t 30S</span>, <span class="kbd">-t 1M</span>.
• Disable logs to avoid blocking (<span class="kbd">--no-log</span>).
• Availability should be high (≥ 99%).`
      }
    };

    const g = GUIDES[id];
    const $ = s => document.querySelector(s);
    if (!g) {
      $('#title').textContent = 'Guide not found';
      $('#desc').textContent = 'Invalid ID. Go back and choose another CLI test.';
      $('#cmd').textContent = '—';
      $('#notes').textContent = '—';
    } else {
      $('#title').textContent = g.title + ' (CLI)';
      $('#desc').textContent = g.desc;
      $('#cmd').textContent = g.cmd;
      $('#notes').innerHTML = g.notes;
    }
  </script>
</body>
</html>
