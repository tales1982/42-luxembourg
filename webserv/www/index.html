<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>webserv 42</title>
  <style>
    /* ===== Reset básico ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      padding: 40px;
      border-radius: 16px;
      max-width: 700px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #ffda79;
      text-shadow: 0 0 8px rgba(255, 218, 121, 0.6);
    }

    ul {
      list-style: none;
      margin: 20px 0;
    }

    ul li {
      margin: 12px 0;
    }

    ul li a {
      text-decoration: none;
      color: #00e0ff;
      font-weight: bold;
      transition: color 0.3s ease, transform 0.2s ease;
    }

    ul li a:hover {
      color: #ffda79;
      transform: scale(1.05);
    }

    form {
      margin-top: 30px;
      text-align: left;
    }

    form h3 {
      margin-bottom: 10px;
      color: #ffd86b;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      resize: none;
      outline: none;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    button {
      margin-top: 12px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #ffda79, #ff9a3c);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 218, 121, 0.6);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>It works 🎉</h1>
    <ul>
      <li><a href="/files/index.html">/files/</a> (autoindex + upload via POST)</li>
      <li><a href="/cgi/echo.py?hello=world">/cgi/echo.py</a> (CGI)</li>
      <li><a href="/old">/old</a> → /new</li>
    </ul>
    <form method="POST" action="/files/">
      <h3>Upload (raw)</h3>
      <textarea name="data" rows="4" cols="60">Digite algo e envie</textarea><br>
      <button>Enviar (POST)</button>
    </form>
  </div>
</body>
</html>
