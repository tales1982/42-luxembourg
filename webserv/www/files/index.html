<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Enviar arquivos</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0b1522; color:#fff; text-align:center; padding:50px; }
    form { margin-top:20px; background:#111; padding:20px; border-radius:12px; display:inline-block; }
    input[type=file] { margin-bottom:12px; }
    button { padding:10px 20px; font-weight:bold; background:#ffd54a; border:none; border-radius:6px; cursor:pointer; }
    button:hover { background:#ffb300; }
    a { color:#90ee90; display:block; margin-top:20px; }
  </style>
</head>
<body>
  <h1>📤 Upload de Arquivos</h1>
  <p>Selecione um arquivo para enviar para o servidor.</p>
  <form method="POST" action="/files/" enctype="multipart/form-data">
    <input type="file" name="file" required />
    <br/>
    <button type="submit">Enviar</button>
  </form>

  <a href="/uploads/">📂 Ver arquivos enviados</a>
</body>
</html>
