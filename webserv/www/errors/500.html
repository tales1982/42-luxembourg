<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Erreur 500 - Erreur interne du serveur</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(120deg, #6a11cb, #2575fc);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .error-container {
      background-color: rgba(0, 0, 0, 0.4);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 3rem;
      color: #ffcc00;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .home-button {
      padding: 12px 24px;
      background-color: #ffcc00;
      color: #000;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .home-button:hover {
      background-color: #e6b800;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1>⚠️ Erreur 500</h1>
    <p>Une erreur interne s'est produite sur le serveur.<br>Veuillez réessayer plus tard.</p>
    <a href="/" class="home-button">⬅ Retour à l'accueil</a>
  </div>
</body>
</html>
