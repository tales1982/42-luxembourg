<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>401 Não Autorizado</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .error-container {
      background: #fff;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #e17055;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    a {
      text-decoration: none;
      color: #fff;
      background: #e17055;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    a:hover {
      background: #ff7675;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1>401 Não Autorizado</h1>
    <p>Você precisa estar autenticado para acessar este recurso.</p>
    <a href="/">Ir para a página inicial</a>
  </div>
</body>
</html>
