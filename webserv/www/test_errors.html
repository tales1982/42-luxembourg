<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Páginas de Erro</title>
  <style>
    body {
      background: #0f2027;
      color: white;
      font-family: sans-serif;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      color: #f39c12;
      margin-bottom: 1rem;
    }

    .buttons {
      margin-bottom: 2rem;
    }

    button {
      background: #1abc9c;
      border: none;
      padding: 0.75rem 1.5rem;
      margin: 0.5rem;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #16a085;
    }

    iframe {
      width: 90%;
      height: 500px;
      border: 2px solid #34495e;
      border-radius: 8px;
      background-color: white;
    }
  </style>
</head>
<body>

  <h1>Simulador de Páginas de Erro</h1>

  <div class="buttons">
    <button onclick="loadError('errors/401.html')">401 Unauthorized</button>
    <button onclick="loadError('errors/403.html')">403 Forbidden</button>
    <button onclick="loadError('errors/404.html')">404 Not Found</button>
    <button onclick="loadError('errors/405.html')">405 Method Not Allowed</button>
    <button onclick="loadError('errors/500.html')">500 Internal Server Error</button>
  </div>

  <iframe id="preview" src=""></iframe>
  <div class="buttons">
    <a href="http://localhost:8080">
  <button>Voltar para Home</button>
</a>

  </div>
 
  <script>
    function loadError(path) {
      document.getElementById('preview').src = path;
    }
  </script>

</body>
</html>
