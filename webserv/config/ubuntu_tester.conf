server {
    listen 8080
    host 127.0.0.1
    server_name localhost
    root ./www

    error_page 403 ./www/errors/403.html
    error_page 404 ./www/errors/404.html
    error_page 405 ./www/errors/405.html
    error_page 500 ./www/errors/500.html

    # / → GET ONLY
    location / {
        methods GET
        index index.html
        autoindex off
    }

    # /put_test/* → PUT (salvar arquivo)
    location /put_test {
        methods PUT
        root ./put_store
        autoindex on
    }

    # .bla → POST via CGI (usa executável cgi_test)
    location ~ \.bla$ {
        methods POST
        root ./YoupiBanane
        cgi_path ./cgi_test
    }

    # /post_body → POST com máx 100 bytes
    location /post_body {
        methods POST
        client_max_body_size 100
        root ./www
    }

    # /directory/ → GET, root=YoupiBanane; se diretório, usa index youpi.bad_extension
    location /directory {
        methods GET
        root ./YoupiBanane
        autoindex on
        index youpi.bad_extension
    }
}
