server {
    listen 8080
    host 127.0.0.1
    root ./www

    location / {
    methods GET POST
}


    location /put_test {
        methods PUT
        root ./Uploads
    }

    # Evite regex se seu parser não suporta!
    location /youpi.bla {
        methods POST
        cgi_pass on
        root ./YoupiBanane
        cgi_path ./cgi_test
    }

    location /post_body {
        methods POST
        client_max_body_size 100
    }

    location /directory {
        methods GET
        root ./YoupiBanane
        index youpi.bad_extension
    }
}
