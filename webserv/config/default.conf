server {
    listen 8080
    host 127.0.0.1
    server_name localhost
    root ./www
    error_page 403 ./www/errors/403.html
    error_page 405 ./www/errors/405.html
    error_page 404 ./www/errors/404.html
    error_page 500 ./www/errors/500.html
    client_max_body_size 1M

    location / {
        methods GET POST
        index index.html
        autoindex on
    }

    location /upload {
        methods POST
    }

    location /redirect301 {
        return 301 http://example.com
    }

    location /redirect302 {
        return 302 http://example.com
    }

    location /redirect307 {
        return 307 http://example.com
    }

    location /redirect308 {
        return 308 http://example.com
    }


    location /cgi-bin {
    root ./cgi-bin
    methods GET POST
    cgi_pass on
    }


    location /fotos {
    methods GET DELETE
    root ./www/fotos
    autoindex on
    }

    location /pdfs {
        methods GET DELETE
        root ./www/pdfs
    }

    location /othes {
        methods GET DELETE
        root ./www/othes
    }

}
