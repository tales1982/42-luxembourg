<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Téléversement de fichier</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(120deg, #4b6cb7, #182848);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    .upload-container {
      background-color: rgba(0, 0, 0, 0.4);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 350px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    input[type="file"] {
      padding: 10px;
      background-color: #fff;
      border: none;
      border-radius: 5px;
      margin-bottom: 20px;
      width: 100%;
    }

    input[type="submit"],
    .home-button {
      padding: 10px 20px;
      background-color: #00ffcc;
      color: #000;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 10px;
      text-decoration: none;
      display: inline-block;
    }

    input[type="submit"]:hover,
    .home-button:hover {
      background-color: #00ddaa;
    }
  </style>
</head>
<body>
  <div class="upload-container">
    <h1>📤 Téléversement de fichier</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="fichier" required /><br />
      <input type="submit" value="Envoyer le fichier" />
    </form>
    <a href="/" class="home-button">⬅ Retour à l'accueil</a>
  </div>
</body>
</html>
