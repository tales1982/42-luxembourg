server {
    listen 8080
    host 127.0.0.1
    root ./www

    location / {
        methods GET HEAD
    }

    location /put_test {
        methods PUT
        root ./Uploads
    }

    location ~ \.bla$ {
        methods POST
        root ./YoupiBanane
        cgi_pass on
        cgi_path ./cgi_tester
    }

    location /post_body {
        methods POST
        client_max_body_size 100
    }

    location /directory {
        methods GET
        root ./YoupiBanane
        index youpi.bad_extension
    }
}
