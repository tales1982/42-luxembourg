server {
    listen 8080
    host 127.0.0.1
    server_name localhost
    root ./www

    error_page 403 ./www/errors/403.html
    error_page 404 ./www/errors/404.html
    error_page 405 ./www/errors/405.html
    error_page 500 ./www/errors/500.html

    client_max_body_size 5M

    # home + autoindex
    location / {
        methods GET HEAD
        index index.html
        autoindex on
    }

    # uploads “visíveis” e deletáveis nos testes
    location /fotos {
        methods GET DELETE
        root ./www/fotos
        autoindex on
    }

    location /othes {
        methods GET DELETE
        root ./www/othes
        autoindex on
    }

    # endpoint de upload (POST multipart)
    location /upload {
        methods POST
        root ./www/fotos
    }

    # CGI para /cgi-bin/* executando Python
    location /cgi-bin {
        methods GET POST
        root ./cgi-bin
        # O binário deve entender 'cgi_path' como o intérprete:
        cgi_path /usr/bin/python3
        # Ex: GET /cgi-bin/test.py  -> executa /usr/bin/python3 ./cgi-bin/test.py
    }
}
