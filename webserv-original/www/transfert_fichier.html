<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Transfert de fichier (natif)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .upload-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem 3rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin-bottom: 1rem;
      font-size: 1.8rem;
      color: #ffd86f;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    input[type="file"] {
      padding: 0.6rem;
      border-radius: 6px;
      background-color: #fff;
      color: #333;
      font-weight: 600;
      border: none;
      width: 100%;
    }

    button {
      background: linear-gradient(45deg, #00ffcc, #00b894);
      border: none;
      padding: 0.75rem 2rem;
      color: #000;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: linear-gradient(45deg, #00e6b0, #00a383);
    }

    .home-link {
      display: inline-block;
      margin-top: 1.5rem;
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      background-color: #ff6b6b;
      padding: 0.6rem 1.5rem;
      border-radius: 30px;
      transition: background 0.3s ease;
    }

    .home-link:hover {
      background-color: #ff4d4d;
    }
  </style>
</head>
<body>
  <div class="upload-box">
    <h1>📤 Transfert de fichier (natif)</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="fichier" required />
      <button type="submit">Envoyer</button>
    </form>
    <a class="home-link" href="/">⬅ Retour à l'accueil</a>
  </div>
</body>
</html>
